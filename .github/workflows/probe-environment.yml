name: Probe Environment Expression

# Throwaway probe: does `environment: ''` yield no environment, or a validation error?
# Deleted once the answer is recorded.

on:
  workflow_dispatch:
    inputs:
      engine_repo:
        description: Engine repo to resolve trust for.
        type: string
        default: o3de/o3de

permissions:
  contents: read

jobs:
  Resolve-Trust:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      environment: ${{ steps.trust.outputs.environment }}
    steps:
      - name: Resolve secret environment from engine repo
        id: trust
        env:
          ENGINE_REPO: ${{ inputs.engine_repo }}
        run: |
          case "$ENGINE_REPO" in
            o3de/o3de|amzn-changml/o3de)
              echo "environment=packaging" >> "$GITHUB_OUTPUT"
              echo "allowlisted: $ENGINE_REPO" ;;
            *)
              echo "environment=" >> "$GITHUB_OUTPUT"
              echo "::notice::$ENGINE_REPO is not allowlisted; building unsigned with no upload" ;;
          esac

  Consume:
    needs: Resolve-Trust
    runs-on: ubuntu-latest
    environment: ${{ needs.Resolve-Trust.outputs.environment }}
    permissions: {}
    steps:
      - name: Report resolved environment
        env:
          RESOLVED: ${{ needs.Resolve-Trust.outputs.environment }}
        run: |
          echo "resolved environment value: '$RESOLVED'"
          echo "job reached execution, so the environment expression was accepted"
