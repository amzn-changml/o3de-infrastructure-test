name: Linux Package

# Builds, signs, and uploads the O3DE Linux installer SDK (.deb). Build/sign/package
# presets live in scripts/build/Platform/Linux/build_config.json, driven by
# scripts/build/ci_build.py.

on:
  workflow_call:
    inputs:
      image:
        description: GitHub-hosted runner image (e.g. ubuntu-22.04, ubuntu-24.04).
        required: false
        type: string
        default: ubuntu-22.04
      engine_repo:
        description: O3DE engine repository (owner/name) to check out and package.
        required: false
        type: string
        default: o3de/o3de
      engine_ref:
        description: Branch/tag/SHA of the engine to package.
        required: false
        type: string
        default: development
      cmake_version:
        description: CMake version constraint to install.
        required: false
        type: string
        default: "4.2.3"
      clang_version:
        description: Clang major version to install.
        required: false
        type: string
        default: "18"
      gcc_version:
        description: gcc major version to install.
        required: false
        type: string
        default: "13"
      o3de_install_version:
        description: The O3DE version in the installer filename and engine version.
        required: false
        type: string
        default: ""
      o3de_install_display_version:
        description: The O3DE display version in the installer filename and engine display version.
        required: false
        type: string
        default: ""
      o3de_install_build_version:
        description: The O3DE version shown in the splash screens.
        required: false
        type: string
        default: ""
      installer_download_url:
        description: Base URL embedded into the installer for downloading additional artifacts.
        required: false
        type: string
        default: ""
      run_installer_test:
        description: Run the installer smoke test after the build (Linux harness not yet implemented).
        required: false
        type: boolean
        default: false
      installer_s3_path:
        description: "Path to the built installer in S3 (object key, leading slash)."
        required: false
        type: string
        default: /development/Latest/Linux/o3de_installer.deb
    secrets:
      O3DE_GPG_PRIVATE_KEY:
        description: GPG private key used to sign the .deb. Absent produces an unsigned package.
        required: false
      O3DE_GPG_PASSPHRASE:
        description: Passphrase for the GPG private key, if it has one.
        required: false
      INSTALLER_S3_BUCKET:
        description: S3 bucket for the installer upload. Absent disables upload and signing.
        required: false
      AWS_ACCESS_KEY_ID:
        description: AWS access key for the installer upload.
        required: false
      AWS_SECRET_ACCESS_KEY:
        description: AWS secret key for the installer upload.
        required: false
      AWS_REGION:
        description: AWS region for the installer upload.
        required: false

run-name: Linux Package - ${{ inputs.engine_ref }}

# Note: All 3P Github Actions use the commit hash for security reasons
# Avoid using the tag version, which is vulnerable to supply chain attacks

permissions:
  contents: read

jobs:
  # Signing and upload secrets are reachable only when the engine repository being
  # packaged is allowlisted here. Any other repository resolves to no environment,
  # which builds unsigned with no upload and no secret in any step. A failure in
  # this job blocks the jobs that depend on it.
  Resolve-Trust:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      environment: ${{ steps.trust.outputs.environment }}
    steps:
      - name: Resolve secret environment from engine repo
        id: trust
        env:
          ENGINE_REPO: ${{ inputs.engine_repo }}
        run: |
          case "$ENGINE_REPO" in
            o3de/o3de|amzn-changml/o3de)
              echo "environment=packaging" >> "$GITHUB_OUTPUT"
              echo "$ENGINE_REPO is allowlisted; signing and upload are available" ;;
            *)
              echo "environment=" >> "$GITHUB_OUTPUT"
              echo "::notice::$ENGINE_REPO is not allowlisted; building unsigned with no upload" ;;
          esac

  Build-Installer:
    needs: Resolve-Trust
    runs-on: ${{ inputs.image }}
    environment: ${{ needs.Resolve-Trust.outputs.environment }}
    outputs:
      signing_configured: ${{ steps.signing-env.outputs.signing_configured }}
      installer_s3_uri: ${{ steps.upload-env.outputs.installer_s3_uri }}
    steps:
      - name: Check disk space
        env:
          MIN_FREE_DISK: 70 # in GB
          WORKSPACE: ${{ github.workspace }}
        id: check-disk
        run: |
          AVAIL_GB=$(df "$WORKSPACE" --output=avail --block-size=1G | tail -1 | tr -d ' ')
          echo "Workspace has ${AVAIL_GB}GB available"
          if [ "$AVAIL_GB" -lt "$MIN_FREE_DISK" ]; then
            echo "needs_resize=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_resize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Maximize build space
        if: steps.check-disk.outputs.needs_resize == 'true'
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          root-reserve-mb: 8000
          swap-size-mb: 200
          remove-dotnet: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Checkout engine
        # Credentials persist here because the Git LFS pull below re-contacts the
        # remote, which a private engine fork requires. Every other checkout in
        # this workflow sets persist-credentials: false.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.engine_repo }}
          ref: ${{ inputs.engine_ref }}
          show-progress: false

      - name: Checkout packaging tooling
        # Supplies the build orchestration and the scripts that handle signing
        # material, so any engine repo/ref can be packaged even when it does not
        # carry this tooling.
        #
        # Scope of the overlay: it replaces the python files under scripts/build
        # listed in engine-tooling. It does NOT replace build_config.json,
        # scripts/build/Platform/<P>/*.sh, cmake/, scripts/signer/, or
        # install-ubuntu.sh, all of which come from the packaged ref and are
        # executed by the build. Secrets are gated by the Resolve-Trust
        # allowlist, not by this overlay.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: .packaging-tooling
          show-progress: false

      - name: Overlay packaging tooling
        run: |
          cp -av .packaging-tooling/engine-tooling/scripts/build/. scripts/build/
          rm -rf .packaging-tooling

      - name: Git LFS pull
        run: |
          git lfs install
          git lfs pull

      - name: Setup 3p, user, and build folders
        run: |
          mkdir -p .o3de build 3rdParty && ln -sf "$(pwd)/.o3de" ~/.o3de

      - name: Setup ccache
        # Package runs start on cold runners, so persist the compiler cache across
        # runs via the GitHub cache. 5G compressed keeps within the repo cache quota.
        uses: chocobo1/setup-ccache-action@37c3347f8a7738e82aab7a06f276f7a12e3008fb # v1.5.3
        continue-on-error: true
        if: always()
        with:
          prepend_symlinks_to_path: false
          store_cache: true
          restore_cache: true
          ccache_options: |
            cache_dir=${{ github.workspace }}/.ccache
            hash_dir=false
            max_size=5G

      - name: Setup cmake
        if: ${{ inputs.cmake_version }}
        uses: lukka/get-cmake@f176ccd3f28bda569c43aae4894f06b2435a3375 # v4.2.3
        with:
          cmakeVersion: "${{ inputs.cmake_version }}"

      - name: Set GCC version
        if: ${{ inputs.gcc_version }}
        # Version arrives via env rather than inline interpolation so a crafted
        # input cannot inject shell into these root-run commands.
        env:
          GCC_VERSION: ${{ inputs.gcc_version }}
        run: |
          case "$GCC_VERSION" in
            ''|*[!0-9]*) echo "::error::gcc_version must be numeric, got '$GCC_VERSION'"; exit 1 ;;
          esac
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update -y
          sudo apt-get install -y "gcc-$GCC_VERSION" "g++-$GCC_VERSION"
          sudo update-alternatives --install /usr/bin/gcc gcc "/usr/bin/gcc-$GCC_VERSION" 100
          sudo update-alternatives --install /usr/bin/g++ g++ "/usr/bin/g++-$GCC_VERSION" 100

      - name: Install specific clang version
        if: ${{ inputs.clang_version }}
        env:
          CLANG_VERSION: ${{ inputs.clang_version }}
        run: |
          case "$CLANG_VERSION" in
            ''|*[!0-9]*) echo "::error::clang_version must be numeric, got '$CLANG_VERSION'"; exit 1 ;;
          esac
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"
          sudo apt-get install -y "lld-$CLANG_VERSION" "clang-tools-$CLANG_VERSION"
          echo "CC=$(which "clang-$CLANG_VERSION")" >> "$GITHUB_ENV"
          echo "CXX=$(which "clang++-$CLANG_VERSION")" >> "$GITHUB_ENV"

      - name: Configure environment
        continue-on-error: true
        run: |
          echo "Installing dependencies"
          pushd ./scripts/build/build_node/Platform/Linux
          sudo ./install-ubuntu.sh
          popd
          echo "Getting python..."
          ./python/get_python.sh
          echo "Installing additional python dependencies..."
          ./python/pip.sh install tempfile2 PyGithub
          # dpkg-sig is required by scripts/signer/Platform/Linux/signer.sh
          sudo apt-get install -qq dpkg-sig -y
          sudo apt -y autoremove --purge
          sudo apt clean
          df -h

      - name: Configure signing
        # Import the GPG private key secret into the keyring; absent secrets produce an
        # unsigned package. Signing only engages when CPACK_UPLOAD_URL is set.
        id: signing-env
        env:
          O3DE_GPG_PRIVATE_KEY: ${{ secrets.O3DE_GPG_PRIVATE_KEY }}
          O3DE_GPG_PASSPHRASE: ${{ secrets.O3DE_GPG_PASSPHRASE }}
        run: |
          GPG_TTY=$(tty || true)
          export GPG_TTY
          set -o pipefail
          python/python.sh -u scripts/build/prepare_signing.py --platform Linux | while IFS= read -r line; do
            case "$line" in
              "ENV "*) echo "${line#ENV }" >> "$GITHUB_ENV" ;;
              "OUTPUT "*) echo "${line#OUTPUT }" >> "$GITHUB_OUTPUT" ;;
              *) echo "$line" ;;
            esac
          done

      - name: Compute upload/installer URI
        # Empty bucket secret means no S3 upload (and no signing, which requires upload)
        id: upload-env
        env:
          INSTALLER_S3_BUCKET: ${{ secrets.INSTALLER_S3_BUCKET }}
          INSTALLER_S3_PATH: ${{ inputs.installer_s3_path }}
        run: |
          set -o pipefail
          python/python.sh -u scripts/build/compute_upload_uri.py --s3-path "$INSTALLER_S3_PATH" | while IFS= read -r line; do
            case "$line" in
              "ENV "*) echo "${line#ENV }" >> "$GITHUB_ENV" ;;
              "OUTPUT "*) echo "${line#OUTPUT }" >> "$GITHUB_OUTPUT" ;;
              *) echo "$line" ;;
            esac
          done

      - name: Build installer
        # Builds with presets in ../scripts/build/Platform/Linux/build_config.json
        timeout-minutes: 600
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          LY_3RDPARTY_PATH: ${{ github.workspace }}/3rdParty
          LY_PACKAGE_SERVER_URLS: "https://d1gg6ket0m44ly.cloudfront.net;https://d3t6xeg4fgfoum.cloudfront.net"
          O3DE_INSTALL_VERSION: ${{ inputs.o3de_install_version }}
          O3DE_INSTALL_DISPLAY_VERSION: ${{ inputs.o3de_install_display_version }}
          O3DE_INSTALL_BUILD_VERSION: ${{ inputs.o3de_install_build_version }}
          INSTALLER_DOWNLOAD_URL: ${{ inputs.installer_download_url }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          # install-ubuntu.sh writes LY_NDK_DIR (needed by the android mono steps) to
          # /etc/profile.d/android-env.sh, which non-login CI shells do not source
          [ -f /etc/profile.d/android-env.sh ] && source /etc/profile.d/android-env.sh
          export EXTRA_CMAKE_OPTIONS="-DCMAKE_C_COMPILER=$CC -DCMAKE_CXX_COMPILER=$CXX"
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          python/python.sh -u scripts/build/ci_build.py --platform Linux --type installer_pipe

      - name: Save installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: O3DE-Linux-installer
          compression-level: 1
          overwrite: true
          if-no-files-found: warn
          path: |
            ${{ github.workspace }}/build/linux/CPackUploads/*.deb
            ${{ github.workspace }}/build/linux/CPackUploads/*.sha256

  # Linux installer_test harness is not yet implemented; stub matches the Windows job shape
  Installer-Test:
    needs: Build-Installer
    if: ${{ inputs.run_installer_test && !cancelled() && needs.Build-Installer.result == 'success' }}
    runs-on: ${{ inputs.image }}
    steps:
      - name: Not yet implemented
        run: |
          echo "::warning::Linux installer_test is not yet implemented. Skipping."
          echo "Add a Linux installer_test preset to scripts/build/Platform/Linux/build_config.json"
          echo "and a pytest harness under cmake/Platform/Linux/Packaging/Tests, then mirror"
          echo "the Windows Installer-Test job here."
